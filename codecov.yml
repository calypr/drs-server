codecov:
  require_ci_to_pass: true

comment:
  layout: "reach,diff,flags,tree"
  behavior: default
  require_changes: false
  require_base: false
  require_head: true

fixes:
  - "github.com/calypr/syfon/::"

ignore:
  - "apigen/**"
  - "data-repository-service-schemas/**"
  - "tests/**"
  - "internal/testsupport/**"
  - "client/internal/testmocks/**"
  - "cmd/openapi-remove-examples/**"

coverage:
  precision: 2
  round: down
  range: "60...100"
  status:
    project:
      default:
        target: auto
        threshold: 1%
      root:
        flags: [root, binary-endpoint]
        target: auto
        threshold: 1%
      client:
        flags: [client]
        target: auto
        threshold: 1%

flags:
  root:
    paths: ["main.go", "cmd/", "internal/", "plugin/"]
    carryforward: false
  client:
    paths: ["client/"]
    carryforward: false
  binary-endpoint:
    carryforward: false

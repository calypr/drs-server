openapi: 3.0.3
info:
  title: Internal Compatibility API (DRS Server)
  version: 1.0.0
  description: |
    Consolidated internal API delta for drs-server.
    This spec captures non-GA4GH DRS internal/compatibility routes.
servers:
  - url: /
tags:
  - name: internal-index
  - name: internal-data
paths:
  /index:
    get:
      tags:
        - internal-index
      operationId: internalList
      parameters:
        - in: query
          name: hash
          schema:
            type: string
        - in: query
          name: url
          schema:
            type: string
        - in: query
          name: organization
          schema:
            type: string
        - in: query
          name: program
          schema:
            type: string
        - in: query
          name: project
          schema:
            type: string
        - in: query
          name: path
          schema:
            type: string
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 10000
            default: 1000
        - in: query
          name: start
          schema:
            type: string
        - in: query
          name: page
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        '200':
          description: List response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListRecordsResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
    post:
      tags:
        - internal-index
      operationId: internalCreate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InternalRecord'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalRecordResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
    delete:
      tags:
        - internal-index
      operationId: internalDeleteByQuery
      parameters:
        - in: query
          name: organization
          schema:
            type: string
        - in: query
          name: program
          schema:
            type: string
        - in: query
          name: project
          schema:
            type: string
        - in: query
          name: hash
          schema:
            type: string
        - in: query
          name: hash_type
          schema:
            type: string
      responses:
        '200':
          description: Deleted count
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteByQueryResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
  /index/{id}:
    get:
      tags:
        - internal-index
      operationId: internalGet
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Record
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalRecordResponse'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
    put:
      tags:
        - internal-index
      operationId: internalUpdate
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InternalRecord'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalRecordResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
    delete:
      tags:
        - internal-index
      operationId: internalDelete
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Deleted
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
  /index/{id}/controlled-access/remove:
    post:
      tags:
        - internal-index
      operationId: internalRemoveControlledAccess
      parameters:
        - in: path
          name: id

components:
  schemas:
    APIError:
      $ref: './error.openapi.yaml#/components/schemas/APIError'
    ControlledAccessRemoveRequest:
      type: object
      required:
        - resource
      properties:
        resource:
          type: string
    HashInfo:
      type: object
      additionalProperties:
        type: string
      description: Hash map, e.g. {"sha256":"..."}
    InternalRecord:
      type: object
      required:
        - did
      properties:
        did:
          type: string
          minLength: 1
        name:
          type: string
        name_aliases:
          type: array
          items:
            type: string
        hashes:
          $ref: '#/components/schemas/HashInfo'
        size:
          type: integer
          format: int64
        controlled_access:
          type: array
          items:
            type: string
        access_methods:
          type: array
          items:
            $ref: './openapi.yaml#/components/schemas/AccessMethod'
        organization:
          type: string
        project:
          type: string
        version:
          type: string
        description:
          type: string
        created_time:
          type: string
        updated_time:
          type: string
    InternalRecordResponse:
      allOf:
        - $ref: '#/components/schemas/InternalRecord'
        - type: object
          properties:
            baseid:
              type: string
            rev:
              type: string
            created_date:
              type: string
            updated_date:
              type: string
            uploader:
              type: string
    ListRecordsResponse:
      type: object
      properties:
        records:
          type: array
          items:
            $ref: '#/components/schemas/InternalRecord'
    BulkCreateRequest:
      type: object
      required:
        - records
      properties:
        records:
          type: array
          items:
            $ref: '#/components/schemas/InternalRecord'
    BulkOverwriteRequest:
      type: object
      required:
        - organization
        - project
        - records
      properties:
        organization:
          type: string
        project:
          type: string
        records:
          type: array
          maxItems: 1000
          items:
            $ref: '#/components/schemas/InternalRecord'
    BulkOverwriteResponse:
      type: object
      required:
        - processed
        - created
        - replaced
        - did_matched
        - checksum_matched
      properties:
        processed:
          type: integer
        created:
          type: integer
        replaced:
          type: integer
        did_matched:
          type: integer
        checksum_matched:
          type: integer
    BulkHashesRequest:
      type: object
      required:
        - hashes
      properties:
        hashes:
          type: array
          items:
            type: string
    BulkSHA256ValidityRequest:
      type: object
      properties:
        sha256:
          type: array
          items:
            type: string
        hashes:
          type: array
          items:
            type: string
    BulkMissingSHA256Request:
      type: object
      required:
        - organization
        - project
        - sha256
      properties:
        organization:
          type: string
        project:
          type: string
        sha256:
          type: array
          items:
            type: string
    BulkMissingSHA256Response:
      type: object
      required:
        - checked
        - missing_sha256
      properties:
        checked:
          type: integer
          format: int32
        missing_sha256:
          type: array
          items:
            type: string
    BulkDocumentsRequest:
      oneOf:
        - type: array
          items:
            type: string
        - type: object
          properties:
            ids:
              type: array
              items:
                type: string
    DeleteByQueryResponse:
      type: object
      properties:
        deleted:
          type: integer
    InternalSignedURL:
      type: object
      properties:
        url:
          type: string
    InternalProjectBucketInventoryRequest:
      type: object
      properties:
        organization:
          type: string
        project:
          type: string
        path_prefix:
          type: string
    InternalProjectBucketInventoryResponse:
      type: object
      properties:
        summary:
          $ref: '#/components/schemas/InternalProjectBucketInventorySummary'
        items:
          type: array
          items:
            $ref: '#/components/schemas/InternalProjectBucketInventoryItem'
    InternalProjectBucketInventorySummary:
      type: object
      properties:
        provider:
          type: string
        bucket:
          type: string
        prefix:
          type: string
        object_url:
          type: string
        exists:
          type: boolean
        object_count:
          type: integer
        total_bytes:
          type: integer
          format: int64
        computed_at:
          type: string
        mode:
          type: string
    InternalProjectBucketInventoryItem:
      type: object
      properties:
        object_url:
          type: string
        provider:
          type: string
        bucket:
          type: string
        key:
          type: string
        path:
          type: string
        size_bytes:
          type: integer
          format: int64
        meta_sha256:
          type: string
        etag:
          type: string
        last_modified:
          type: string
    InternalProjectScopesRequest:
      type: object
      required:
        - organization
        - project
      properties:
        organization:
          type: string
        project:
          type: string
    InternalProjectScopesResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/InternalProjectScopeItem'
    InternalProjectScopeItem:
      type: object
      properties:
        bucket:
          type: string
        organization:
          type: string
        project_id:
          type: string
        path:
          type: string
    InternalUploadBlankRequest:
      type: object
      properties:
        guid:
          type: string
        organization:
          type: string
        project:
          type: string
    InternalUploadBlankOutput:
      type: object
      properties:
        guid:
          type: string
        url:
          type: string
        bucket:
          type: string
    InternalUploadBulkRequest:
      type: object
      required:
        - requests
      properties:
        requests:
          type: array
          items:
            $ref: '#/components/schemas/InternalUploadBulkItem'
    InternalUploadBulkItem:
      type: object
      required:
        - file_id
      properties:
        file_id:
          type: string
        key:
          type: string
        organization:
          type: string
        project:
          type: string
        expires_in:
          type: integer
          format: int32
    InternalUploadBulkOutput:
      type: object
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/InternalUploadBulkResult'
    InternalUploadBulkResult:
      type: object
      required:
        - file_id
        - status
      properties:
        file_id:
          type: string
        bucket:
          type: string
        key:
          type: string
        url:
          type: string
        status:
          type: integer
          format: int32
        error:
          type: string
    InternalMultipartInitRequest:
      type: object
      properties:
        guid:
          type: string
        key:
          type: string
        organization:
          type: string
        project:
          type: string
    InternalMultipartInitOutput:
      type: object
      properties:
        guid:
          type: string
        uploadId:
          type: string
    InternalMultipartUploadRequest:
      type: object
      required:
        - key
        - uploadId
        - partNumber
      properties:
        key:
          type: string
        bucket:
          type: string
        uploadId:
          type: string
        partNumber:
          type: integer
          format: int32
    InternalMultipartUploadOutput:
      type: object
      properties:
        presigned_url:
          type: string
    InternalMultipartPart:
      type: object
      required:
        - PartNumber
        - ETag
      properties:
        PartNumber:
          type: integer
          format: int32
        ETag:
          type: string
    InternalMultipartCompleteRequest:
      type: object
      required:
        - key
        - uploadId
        - parts
      properties:
        key:
          type: string
        bucket:
          type: string
        uploadId:
          type: string
        parts:
          type: array
          items:
            $ref: '#/components/schemas/InternalMultipartPart'

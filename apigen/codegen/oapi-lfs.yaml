package: lfsapi
generate:
  client: true
  models: true
  fiber-v3-server: true
  strict-server: true
compatibility:
  sort-handler-registrations: true
output-options:
  skip-prune: false
  skip-enum-validate: true
  skip-response-body-getters: true
  skip-client-response-content-type: true
  overlay:
    path: apigen/codegen/oapi-lfs-overlay.yaml
  user-templates:
    client-with-responses.tmpl: apigen/templates/client-with-responses.tmpl

site_name: Syfon
site_url: https://calypr.org/syfon/
site_description: A lightweight, production-grade GA4GH DRS server in Go.
theme:
  name: material
  logo: images/syfon-logo.png
  favicon: images/syfon-logo.png
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Quick Start: quickstart.md
  - Local Deployment: local-deployment.md
  - Kubernetes Deployment: kubernetes-deployment.md
  - Configuration: configuration.md
  - Encryption: encryption.md
  - Troubleshooting: troubleshooting.md
  - Operations:
    - Transfer Metrics: access-grants-transfer-metrics.md
    - Plugin Integration: plugins.md
    - Code Generation: operator-guide-code-generation.md
  - Advanced:
    - Ranged Downloads: multi-cloud-multipart.md
    - apigen Module Release: apigen-module-release.md

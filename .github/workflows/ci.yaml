name: Syfon CI

permissions:
  contents: read

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches:
      - main
      - development
  workflow_dispatch:
  workflow_call:

concurrency:
  group: syfon-${{ github.event.pull_request.head.ref || github.ref }}
  cancel-in-progress: true

jobs:
  verify-generated:
    name: Verify generated bindings
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify generated API bindings are up to date
        run: |
          make gen-server gen-client
          git diff --exit-code -- apigen/server apigen/client apigen/openapi/internal.openapi.yaml apigen/openapi/bucket.openapi.yaml

  test:
    name: Unit, router, and endpoint tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: verify-generated
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Run unit tests
        run: make test-unit

      - name: Run server endpoint router tests
        run: |
          CGO_ENABLED=1 go test ./cmd/server \
            -run 'Test(AllRegisteredEndpoints_WithMocks|RegisterAPIRoutes_StaticBeforeParamAcrossControllers|RegisterControllerRoutes_StaticBeforeParam)' \
            -v

      - name: Run instrumented binary endpoint tests
        run: |
          mkdir -p coverage/gocover-endpoint
          export GOCOVERDIR="$(pwd)/coverage/gocover-endpoint"
          CGO_ENABLED=1 go test ./tests/endpoints/... \
            -run '^TestServiceInfoFromMainBinary$' \
            -count=1 \
            -v
          go tool covdata textfmt -i "$GOCOVERDIR" -o coverage/binary-endpoint.out

      - name: Upload binary endpoint coverage to Codecov (OIDC)
        if: github.actor != 'nektos/act'
        id: codecov_binary_endpoint_oidc
        continue-on-error: true
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5
        env:
          CODECOV_SLUG: calypr/syfon
        with:
          use_oidc: true
          files: coverage/binary-endpoint.out
          flags: binary-endpoint
          disable_search: true
          verbose: true
          fail_ci_if_error: true

      - name: Upload binary endpoint coverage to Codecov (token fallback)
        if: github.actor != 'nektos/act' && steps.codecov_binary_endpoint_oidc.outcome == 'failure'
        continue-on-error: true
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5
        env:
          CODECOV_SLUG: calypr/syfon
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage/binary-endpoint.out
          flags: binary-endpoint
          disable_search: true
          verbose: true
          fail_ci_if_error: false

      - name: Upload endpoint coverage artifact
        if: github.actor != 'nektos/act'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-endpoint-${{ github.run_id }}
          path: coverage/binary-endpoint.out
          if-no-files-found: error

  postgres-integration:
    name: PostgreSQL integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: verify-generated
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: syfon_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d syfon_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Run PostgreSQL-backed metadata overwrite test
        env:
          SYFON_TEST_POSTGRES_DSN: host=127.0.0.1 port=5432 user=postgres password=postgres dbname=syfon_test sslmode=disable
        run: CGO_ENABLED=1 go test ./internal/persistence/postgres -run '^TestPostgresBulkOverwriteObjects$' -count=1 -v

  coverage:
    name: Root and client coverage
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: verify-generated
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Run coverage
        run: make coverage

      - name: Run client coverage
        run: |
          COVERAGE_SCOPE=client ./scripts/run_coverage.sh

      - name: Upload root coverage to Codecov (OIDC)
        if: github.actor != 'nektos/act'
        id: codecov_root_oidc
        continue-on-error: true
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5
        env:
          CODECOV_SLUG: calypr/syfon
        with:
          use_oidc: true
          files: coverage/coverage.out
          flags: root
          disable_search: true
          verbose: true
          fail_ci_if_error: true

      - name: Upload root coverage to Codecov (token fallback)
        if: github.actor != 'nektos/act' && steps.codecov_root_oidc.outcome == 'failure'
        continue-on-error: true
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5
        env:
          CODECOV_SLUG: calypr/syfon
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage/coverage.out
          flags: root
          disable_search: true
          verbose: true
          fail_ci_if_error: false

      - name: Upload client coverage to Codecov (OIDC)
        if: github.actor != 'nektos/act'
        id: codecov_client_oidc
        continue-on-error: true
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5
        env:
          CODECOV_SLUG: calypr/syfon
        with:
          use_oidc: true
          files: client/coverage/coverage.out
          flags: client
          disable_search: true
          verbose: true
          fail_ci_if_error: true

      - name: Upload client coverage to Codecov (token fallback)
        if: github.actor != 'nektos/act' && steps.codecov_client_oidc.outcome == 'failure'
        continue-on-error: true
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5
        env:
          CODECOV_SLUG: calypr/syfon
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: client/coverage/coverage.out
          flags: client
          disable_search: true
          verbose: true
          fail_ci_if_error: false
      - name: Upload coverage artifacts
        if: github.actor != 'nektos/act'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-${{ github.run_id }}
          path: |
            coverage/coverage.out
            coverage/coverage.txt
            coverage/coverage.html
            client/coverage/coverage.out

  static-checks:
    name: Vet, vuln, and plugins
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: verify-generated
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Build plugin binaries (local_authn_plugin and gen3_authn_plugin)
        run: make build-plugins
        shell: bash

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.1.4

      - name: Run go vet
        run: go vet ./...

      - name: Check for Go CVEs - Root module
        run: $(go env GOPATH)/bin/govulncheck ./...

      - name: Check for Go CVEs - Client module
        run: cd client && $(go env GOPATH)/bin/govulncheck ./...
  integration-test:
    name: Docker Integration Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Run Docker-backed CLI E2E tests (MinIO, fake-gcs-server, Azurite)
        env:
          SYFON_E2E_DOCKER: 1
        run: |
          go test ./cmd \
            -run '^TestSyfonDocker(MinIOE2E|MultipartUpload|FakeGCSE2E|AzuriteE2E)$' \
            -v -count=1

      - name: Run Docker-backed mock server tests
        env:
          SYFON_E2E_MOCK_SERVERS: 1
        run: |
          go test ./internal/storage -run TestStorageMockServers_FakeGCSAndAzurite -count=1 -v

  calypr-integration:
    name: Calypr git-drs integration
    runs-on: ubuntu-latest
    needs: verify-generated
    timeout-minutes: 30
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install kind
        uses: helm/kind-action@06c1ae10762d3b9c1644e7fe69596ae519e015a2 # v1.15.0
        with:
          install_only: true
          version: v0.25.0

      - name: Install Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.16.3

      - name: Install kubectl
        uses: azure/setup-kubectl@829323503d1be3d00ca8346e5391ca0b07a9ab0d # v5.1.0
        with:
          version: v1.31.2

      - name: Run Calypr git-drs scenarios
        env:
          CALYPR_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
          CALYPR_STATE_DIR: ${{ runner.temp }}/syfon-calypr-${{ github.run_id }}-${{ github.run_attempt }}
        run: tests/calypr/run.sh all

      - name: Upload sanitized diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: calypr-integration-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/syfon-calypr-${{ github.run_id }}-${{ github.run_attempt }}/artifacts
          if-no-files-found: warn
          retention-days: 7

  build-and-push:
    name: Build syfon
    runs-on: ${{ matrix.arch == 'amd64' && 'ubuntu-latest' || 'ubuntu-24.04-arm' }}
    timeout-minutes: 20
    strategy:
      matrix:
        arch: [amd64, arm64]
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: quay.io/ohsu-comp-bio/syfon
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,format=short
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' && !contains(github.ref_name, '-rc.') }}

      - name: Login to Quay.io
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_ROBOT_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          # We push by digest first so we can merge them in the next job
          outputs: type=image,name=quay.io/ohsu-comp-bio/syfon,push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=syfon-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=syfon-${{ matrix.arch }}

      - name: Export digest
        run: |
          set -euo pipefail
          mkdir -p /tmp/digests
          printf '%s\n' "${{ steps.build.outputs.digest }}" > "/tmp/digests/${{ matrix.arch }}.txt"
          
      - name: Upload digest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digests-syfon-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  ci-required:
    name: Required CI
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs:
      - verify-generated
      - test
      - postgres-integration
      - coverage
      - static-checks
      - integration-test
      - calypr-integration
    steps:
      - name: Require every validation job
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: jq -e 'all(.[]; .result == "success")' <<<"$NEEDS_JSON"

  merge:
    name: Merge and Tag
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs:
      - ci-required
      - build-and-push
    steps:
      - name: Download digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: /tmp/digests
          pattern: digests-syfon-*
          merge-multiple: true

      - name: Docker meta (re-run for tags)
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: quay.io/ohsu-comp-bio/syfon
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' && !contains(github.ref_name, '-rc.') }}

      - name: Login to Quay.io
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_ROBOT_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Create manifest list and push
        run: |
          set -euo pipefail
          mapfile -t digests < <(cat /tmp/digests/*.txt)
          docker buildx imagetools create $(echo $DOCKER_METADATA_OUTPUT_TAGS | xargs -n 1 echo -t) \
            $(printf 'quay.io/ohsu-comp-bio/syfon@%s ' "${digests[@]}")

# Automatic releases prepare sibling module versions before tagging a release
# commit. After publishing, sync those requirements back to development.
# Manual semver/rc tags release the commit selected by the caller.

name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-rc.[0-9]+'
  workflow_run:
    workflows:
      - Syfon CI
    types:
      - completed
    branches:
      - development

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'workflow_run' && 'development' || github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prepare:
    name: Prepare release tag
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: |
      github.actor != 'nektos/act' &&
      (
        github.event_name == 'push' ||
        (
          github.event_name == 'workflow_run' &&
          github.event.workflow_run.event == 'push' &&
          github.event.workflow_run.head_repository.full_name == github.repository &&
          github.event.workflow_run.head_branch == 'development' &&
          github.event.workflow_run.conclusion == 'success'
        )
      )

    permissions:
      contents: write

    outputs:
      root_tag: ${{ steps.version.outputs.root_tag }}
      apigen_tag: ${{ steps.version.outputs.apigen_tag }}
      client_tag: ${{ steps.version.outputs.client_tag }}
      sha: ${{ steps.version.outputs.sha }}

    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_run' && 'development' || github.ref }}

      - name: Verify workflow source commit
        if: github.event_name == 'workflow_run'
        env:
          EXPECTED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Fetch tags
        run: git fetch --tags --force

      - name: Prepare module versions and release tags
        id: version
        env:
          HEAD_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: scripts/prepare-release.sh

  build:
    name: Build (${{ matrix.os }}/${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    needs: [prepare]
    if: needs.prepare.outputs.root_tag != ''
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: linux,  arch: amd64, native_arch: x86_64, runner: ubuntu-latest      }
          - { os: linux,  arch: arm64, native_arch: aarch64, runner: ubuntu-24.04-arm   }
          - { os: darwin, arch: amd64, native_arch: x86_64, runner: macos-15-intel    }
          - { os: darwin, arch: arm64, native_arch: arm64, runner: macos-latest       }

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ needs.prepare.outputs.root_tag }}

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify native runner architecture
        shell: bash
        env:
          EXPECTED_ARCH: ${{ matrix.native_arch }}
        run: test "$(uname -m)" = "$EXPECTED_ARCH"

      - name: Build
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
          GIT_BRANCH: ${{ github.ref_name }}
          GIT_UPSTREAM: ${{ github.server_url }}/${{ github.repository }}
        run: |
          CGO_ENABLED=1 make build BUILD_OUTPUT=syfon-${{ matrix.os }}-${{ matrix.arch }}

      - name: Upload artifact
        if: github.actor != 'nektos/act'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: syfon-${{ matrix.os }}-${{ matrix.arch }}
          path: syfon-${{ matrix.os }}-${{ matrix.arch }}
          if-no-files-found: error
          retention-days: 1

  release:
    name: Release
    needs: [prepare, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: needs.prepare.outputs.root_tag != ''

    permissions:
      contents: write
      issues: write
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ needs.prepare.outputs.root_tag }}

      - name: Fetch tags
        run: git fetch --tags --force

      - name: Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          pattern: syfon-*
          merge-multiple: true

      - name: Package archives and checksums
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.root_tag }}
        run: |
          set -euo pipefail
          cd dist
          for binary in syfon-linux-* syfon-darwin-*; do
            [[ -f "$binary" ]] || continue
            archive="${binary}-${RELEASE_TAG}.tar.gz"
            cp "$binary" syfon
            tar -czf "$archive" syfon
            rm syfon
          done
          sha256sum *.tar.gz > "syfon-${RELEASE_TAG}-checksums.txt"
          ls -lh

      - name: Generate changelog
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.root_tag }}
        run: |
          set -euo pipefail
          prev=$(git tag --sort=-version:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sed -n '2p' || true)
          if [[ -n "${prev}" ]]; then
            notes=$(git log "${prev}".."${RELEASE_TAG}" --pretty=format:'- %s (%h)' --no-merges)
          else
            notes=$(git log "${RELEASE_TAG}" --pretty=format:'- %s (%h)' --no-merges)
          fi
          echo "$notes" > release-notes.md

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.prepare.outputs.root_tag }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release already exists: $RELEASE_TAG"
            exit 0
          fi

          flags=""
          if [[ "$RELEASE_TAG" =~ -rc\.[0-9]+$ ]]; then
            flags="--prerelease"
          fi

          gh release create "$RELEASE_TAG" \
            --title "$RELEASE_TAG" \
            --notes-file release-notes.md \
            ${flags} \
            dist/*.tar.gz \
            "dist/syfon-${RELEASE_TAG}-checksums.txt"

  sync-module-versions:
    name: Sync module versions
    needs: [prepare, release]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: needs.prepare.outputs.root_tag != ''

    permissions:
      contents: write

    steps:
      - name: Checkout development
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: development

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Replace local module links with released versions
        env:
          ROOT_TAG: ${{ needs.prepare.outputs.root_tag }}
          APIGEN_TAG: ${{ needs.prepare.outputs.apigen_tag }}
          CLIENT_TAG: ${{ needs.prepare.outputs.client_tag }}
        run: |
          set -euo pipefail

          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          apigen_version="${APIGEN_TAG#apigen/}"
          client_version="${CLIENT_TAG#client/}"

          drop_replace_if_present() {
            local module_dir="$1"
            local target="$2"
            if [[ -f "${module_dir}/go.mod" ]]; then
              (cd "$module_dir" && go mod edit -dropreplace "$target") || true
            fi
          }

          require_if_set() {
            local module_dir="$1"
            local target="$2"
            local version="$3"
            if [[ -n "$version" && -f "${module_dir}/go.mod" ]]; then
              (cd "$module_dir" && go mod edit -require="${target}@${version}")
            fi
          }

          tidy_if_present() {
            local module_dir="$1"
            if [[ -f "${module_dir}/go.mod" ]]; then
              (cd "$module_dir" && go mod tidy)
            fi
          }

          for module_dir in . client apigen; do
            drop_replace_if_present "$module_dir" github.com/calypr/syfon/apigen
            drop_replace_if_present "$module_dir" github.com/calypr/syfon/client
          done

          if [[ -n "$APIGEN_TAG" ]]; then
            require_if_set . github.com/calypr/syfon/apigen "$apigen_version"
            require_if_set client github.com/calypr/syfon/apigen "$apigen_version"
          fi

          if [[ -n "$CLIENT_TAG" ]]; then
            require_if_set . github.com/calypr/syfon/client "$client_version"
          fi

          tidy_if_present apigen
          tidy_if_present client
          tidy_if_present .

          git add go.mod go.sum client/go.mod client/go.sum apigen/go.mod apigen/go.sum 2>/dev/null || true

          if git diff --cached --quiet; then
            echo "No module-version cleanup needed."
            exit 0
          fi

          git commit -m "chore: sync module versions after ${ROOT_TAG} [skip ci]"
          git push origin HEAD:development
